<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body style="font-family: 'Apple SD Gothic Neo', Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0;">
<div style="max-width: 600px; margin: 40px auto; background: white; border-radius: 12px; overflow: hidden;">

  <div style="background: #111111; color: white; padding: 32px; text-align: center;">
    <p style="margin: 0 0 8px; color: #A88A5F; font-size: 13px; letter-spacing: 0.3em;">STAY FLOW</p>
    <h1 style="margin: 0; font-size: 24px; letter-spacing: 0.1em;">예약 확인서</h1>
  </div>

  <div style="padding: 32px;">
    <h2 style="font-size: 18px; margin-bottom: 24px;" th:text="'안녕하세요, ' + ${reservation.guestName} +
  '님!'"></h2>
    <p style="color: #555; font-size: 14px; line-height: 1.8; margin-bottom: 24px;">
      StayFlow 예약이 완료되었습니다. 아래 예약 정보를 확인해 주세요.
    </p>

    <table style="width: 100%; border-collapse: collapse;">
      <tr style="border-bottom: 1px solid #f0f0f0;">
        <td style="padding: 12px 4px; font-size: 14px; color: #888; width: 120px;">예약 번호</td>
        <td style="padding: 12px 4px; font-size: 14px;" th:text="'#' + ${reservation.id}"></td>
      </tr>
      <tr style="border-bottom: 1px solid #f0f0f0;">
        <td style="padding: 12px 4px; font-size: 14px; color: #888;">객실</td>
        <td style="padding: 12px 4px; font-size: 14px;" th:text="${reservation.roomType} + ' (Room ' +
  ${reservation.roomNumber} + ')'"></td>
      </tr>
      <tr style="border-bottom: 1px solid #f0f0f0;">
        <td style="padding: 12px 4px; font-size: 14px; color: #888;">체크인</td>
        <td style="padding: 12px 4px; font-size: 14px;" th:text="${reservation.checkInDate}"></td>
      </tr>
      <tr style="border-bottom: 1px solid #f0f0f0;">
        <td style="padding: 12px 4px; font-size: 14px; color: #888;">체크아웃</td>
        <td style="padding: 12px 4px; font-size: 14px;" th:text="${reservation.checkOutDate}"></td>
      </tr>
      <tr>
        <td style="padding: 12px 4px; font-size: 14px; color: #888;">총 금액</td>
        <td style="padding: 12px 4px; font-size: 22px; font-weight: bold; color: #111;"
            th:text="'₩' + ${#numbers.formatInteger(reservation.totalPrice, 1, 'COMMA')}"></td>
      </tr>
    </table>
  </div>

  <div style="background: #f5f3ee; padding: 20px 32px; font-size: 12px; color: #999; text-align: center;">
    본 메일은 발신 전용입니다. 문의는 호텔 프런트로 연락해 주세요.
  </div>

</div>
</body>
</html>
