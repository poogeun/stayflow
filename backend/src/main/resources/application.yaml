spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/stayflow
    username: user
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  config:
    import: optional:classpath:application-secret.yaml

mail:
  from: ${spring.mail.username}

server:
  port: 8080
