services:
  postgres:
    image: postgres:15
    container_name: stayflow-postgres

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user1234
      POSTGRES_DB: stayflow
      TZ: Asia/Seoul

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
